<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Differentiated Mathematics - Derivatives</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-50 text-slate-800 font-sans min-h-screen py-10 px-4 sm:px-6">

    <div class="max-w-3xl mx-auto bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-white/20">
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="inline-block bg-indigo-600 text-white text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-wider shadow-sm mb-3">
                Topic 8: AI for Differentiated Learning
            </span>
            <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">
                📐 AI-Powered Mathematics Differentiator
            </h1>
            <p class="text-slate-600 mt-2 text-base">
                Core Topic: <strong class="text-indigo-600">Derivatives</strong> — Adapt problems dynamically for student readiness levels.
            </p>
        </div>

        <!-- API Key Input Section -->
        <div class="mb-6 bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100">
            <label class="block font-bold text-xs text-indigo-900 uppercase tracking-wider mb-2">🔑 Enter your Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-3 bg-white border border-indigo-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm transition">
        </div>

        <!-- Level Selection -->
        <div class="mb-8">
            <label class="block font-bold text-slate-700 text-sm uppercase tracking-wider mb-3">1️⃣ Select Learner Readiness Level:</label>
            <div class="grid grid-cols-1 gap-3">
                <!-- Level 1 -->
                <label class="relative flex items-start p-4 border-2 rounded-2xl cursor-pointer hover:border-indigo-500 hover:bg-white transition bg-white/60 shadow-sm group">
                    <input type="radio" name="level" value="Level 1: Foundation (Guided step-by-step breakdown, basic power rule of derivatives, and direct helpful hints)" checked class="mt-1 text-indigo-600 focus:ring-indigo-500">
                    <div class="ml-4">
                        <span class="font-bold text-slate-900 group-hover:text-indigo-600 transition">Level 1: Foundation</span>
                        <p class="text-sm text-slate-500 mt-0.5">Guided step-by-step breakdown, basic power rule, and direct hints.</p>
                    </div>
                </label>
                <!-- Level 2 -->
                <label class="relative flex items-start p-4 border-2 rounded-2xl cursor-pointer hover:border-indigo-500 hover:bg-white transition bg-white/60 shadow-sm group">
                    <input type="radio" name="level" value="Level 2: Standard (Standard curriculum problem solving focusing on geometric meaning, slopes, and tangent lines)" class="mt-1 text-indigo-600 focus:ring-indigo-500">
                    <div class="ml-4">
                        <span class="font-bold text-slate-900 group-hover:text-indigo-600 transition">Level 2: Standard</span>
                        <p class="text-sm text-slate-500 mt-0.5">Standard curriculum, geometric meaning, slopes, and tangent lines.</p>
                    </div>
                </label>
                <!-- Level 3 -->
                <label class="relative flex items-start p-4 border-2 rounded-2xl cursor-pointer hover:border-indigo-500 hover:bg-white transition bg-white/60 shadow-sm group">
                    <input type="radio" name="level" value="Level 3: Advanced (Complex multi-step challenge, real-world physics application like motion, velocity, and acceleration)" class="mt-1 text-indigo-600 focus:ring-indigo-500">
                    <div class="ml-4">
                        <span class="font-bold text-slate-900 group-hover:text-indigo-600 transition">Level 3: Advanced</span>
                        <p class="text-sm text-slate-500 mt-0.5">Complex multi-step challenge, physics applications (motion & velocity).</p>
                    </div>
                </label>
            </div>
        </div>

        <!-- Generate Button -->
        <button onclick="generateTask()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-4 rounded-2xl transition duration-200 shadow-xl shadow-indigo-200 cursor-pointer text-base">
            🚀 Generate Differentiated Task
        </button>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center my-10">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
            <p class="text-indigo-600 font-semibold mt-3">AI is crafting your derivative problem... Please wait ⏳</p>
        </div>

        <!-- Result Section -->
        <div id="resultContainer" class="mt-8 hidden border-t border-slate-200 pt-8 animate-fade-in">
            <h2 class="text-xl font-extrabold text-slate-900 mb-4 flex items-center gap-2">
                <span>📝</span> Generated Task & Guidance:
            </h2>
            <div id="output" class="prose max-w-none bg-indigo-50/30 p-6 rounded-2xl border border-indigo-100 text-slate-700 leading-relaxed text-sm sm:text-base space-y-4 shadow-inner"></div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        async function generateTask() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const selectedLevel = document.querySelector('input[name="level"]:checked').value;
            const outputDiv = document.getElementById('output');
            const resultContainer = document.getElementById('resultContainer');
            const loadingDiv = document.getElementById('loading');
            const generateBtn = document.getElementById('generateBtn');

            if (!apiKey) {
                alert('Please enter your Gemini API key first!');
                return;
            }

            loadingDiv.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const prompt = `
            You are an expert Mathematics Educator specializing in Differentiated Instruction.
            The core mathematical topic is "Derivatives".
            The selected student readiness level is: ${selectedLevel}.

            Please generate a comprehensive output containing:
            1. **Problem Statement**: A clear math problem appropriate for this level.
            2. **Step-by-Step Solution**: Complete mathematical solution and justification.
            3. **Interactive Hint**: A helpful clue that guides the learner without revealing the direct final answer.
            4. **Common Misconception**: One typical student error related to this problem and how to avoid it.
            
            Format the response clearly using Markdown with bold headers. Keep the mathematical notation accurate.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    const rawText = data.candidates[0].content.parts[0].text;
                    outputDiv.innerHTML = marked.parse(rawText);
                    resultContainer.classList.remove('hidden');
                } else {
                    alert('Error from Gemini API: ' + (data.error ? data.error.message : 'Unknown error'));
                }
            } catch (error) {
                alert('Network or API error: ' + error.message);
            } finally {
                loadingDiv.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
